[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnlab"
version = "0.1.1"
description = "Localhost-only web vulnerability lab: small vulnerable services, proofs, fixes, detections"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
  "pySigma==2.1.0",
  "sigma-cli==4.0.0",
  "PyYAML==6.0.3",
  "sinkline @ git+https://github.com/samiali38183/sinkline@v0.5.0",
  "tripline @ git+https://github.com/samiali38183/tripline@v0.2.1",
]

[tool.setuptools]
packages = ["vulnlab_common"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "labs"]

[tool.ruff]
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
